name: publish

# Two independent release trains, because the core and the MCP server version
# separately and a version number can never be reused on PyPI:
#
#   v*      -> filekeeper-cli  (the Core library and the `keeper` CLI)
#   mcp-v*  -> filekeeper-mcp  (the STDIO MCP server)
#
# One tag uploads exactly one distribution. A single tag that uploaded both
# would burn two version numbers at once and make a failed half unfixable.
#
# The manual trigger builds and inspects the artefacts of the current commit;
# it never uploads either distribution, because PyPI cannot accept the same
# version twice.
on:
  push:
    tags:
      - "v*"
      - "mcp-v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project and its development dependencies
        run: uv sync

      - name: Run the test suite
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

  publish:
    name: publish
    needs: test
    # Core train: a `v*` tag, or a manual run (which never uploads).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No `environment:` key: trusted publishing is registered for all
    # environments, so the OIDC subject is unrestricted.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build the distributions
        run: python -m build

      - name: Check the distribution metadata
        run: python -m twine check dist/*

      - name: Keep the artefacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Check that the tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          version = re.search(
              r'^version = "([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.MULTILINE,
          ).group(1)
          tag = os.environ["TAG_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {tag} does not match project version {version}")
          print(f"publishing version {version}")
          PY

      - name: Publish to PyPI
        # Tag pushes only. A manual run builds and inspects; it never uploads.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password: the action mints a short-lived token from the OIDC token
        # in this job. No environment key, matching the unrestricted subject.

  publish-mcp:
    name: publish-mcp
    needs: test
    # MCP train: an `mcp-v*` tag, or a manual run (which never uploads).
    if: startsWith(github.ref, 'refs/tags/mcp-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No `environment:` key: the MCP project's trusted publisher is registered
    # for all environments, the same unrestricted shape as the core project.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build the MCP distribution only
        run: python -m build packages/filekeeper-mcp

      - name: Check the MCP distribution metadata
        run: python -m twine check packages/filekeeper-mcp/dist/*

      - name: Keep the MCP artefacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mcp-distributions
          path: packages/filekeeper-mcp/dist/
          if-no-files-found: error

      - name: Check that the tag names the MCP version being built
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          version = re.search(
              r'^version = "([^"]+)"',
              pathlib.Path("packages/filekeeper-mcp/pyproject.toml").read_text(
                  encoding="utf-8"
              ),
              re.MULTILINE,
          ).group(1)
          tag = os.environ["TAG_NAME"].removeprefix("mcp-v")
          if tag != version:
              sys.exit(f"tag {tag} does not match MCP project version {version}")
          print(f"publishing MCP version {version}")
          PY

      - name: Publish the MCP distribution to PyPI
        # Tag pushes only. A manual run builds and inspects; it never uploads.
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/filekeeper-mcp/dist/
        # No password: the action mints a short-lived token from the OIDC token
        # in this job. No environment key, matching the unrestricted subject.
