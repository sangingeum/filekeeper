[project]
name = "filekeeper-mcp"
version = "0.1.8"
description = "MCP server that exposes Filekeeper's filesystem operations to agent hosts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sangingeum", email = "sangingeum@gmail.com" }]
keywords = ["filesystem", "mcp", "agents", "atomic-write"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "filekeeper-cli>=0.1,<0.2",
    # Pinned to the major version this server was built and tested against. The
    # SDK's server API changed between 1.x and 2.x; see docs/decisions.md.
    "mcp>=2.3,<3",
]

[project.scripts]
filekeeper-mcp = "filekeeper_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sangingeum/filekeeper"
Changelog = "https://github.com/sangingeum/filekeeper/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "filekeeper_mcp"
module-root = "src"

[tool.uv.sources]
filekeeper-cli = { workspace = true }
